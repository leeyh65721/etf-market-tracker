name: Inspect official macro source metadata
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/source-probe.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Discover official NFCI CSV links and BEA charts
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          urls=[
           'https://www.chicagofed.org/research/data/nfci/current-data',
           'https://www.chicagofed.org/research/data/nfci/current-data-aws',
           'https://www.bea.gov/data/personal-consumption-expenditures-price-index-excluding-food-and-energy',
           'https://www.bea.gov/data/gdp/gross-domestic-product',
          ]
          for url in urls:
           print('SOURCE',url,flush=True)
           try:
            r=requests.get(url,timeout=18,headers={'User-Agent':'Mozilla/5.0'})
            print('RESPONSE',r.status_code,len(r.content),r.url,flush=True)
            soup=BeautifulSoup(r.text,'html.parser')
            plain=soup.get_text(' ',strip=True)
            print('TEXT_HEAD',plain[:1500],flush=True)
            anchors=[]
            for a in soup.find_all('a',href=True):
             href=a['href']; label=a.get_text(' ',strip=True)
             if any(w in (href+' '+label).lower() for w in ('csv','nfci','data file','download','xlsx','excel')):
              anchors.append((href,label))
            print('LINKS',repr(anchors[:65]),flush=True)
            if 'chicagofed' in url:
             for pat in ['nfcidownloadindexes', 'NFCI Indexes','Download Center','nfci-data','series.csv','csv']:
              matches=list(re.finditer(re.escape(pat),r.text,re.I))
              for match in matches[-3:]:
               pos=match.start()
               print('RAW_MATCH',pat,pos,repr(r.text[max(0,pos-220):pos+470]),flush=True)
             print('JS_ASSETS',[(x.get('src','') or '') for x in soup.select('script[src]')][:80],flush=True)
             for node in soup.find_all('script'):
              text=node.get_text(' ',strip=True)
              if 'nfcidownloadindexes' in text.lower() or 'nfci' in text.lower():
               print('INLINE_SCRIPT',repr(text[:6000]),flush=True)
           except Exception as exc:
            print('ERROR',type(exc).__name__,str(exc)[:350],flush=True)
          PY
