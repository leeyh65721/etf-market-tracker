name: Daily ETF market scan
on:
  # Verify corrected BEA PCE and GDP and original-source NFCI freshness safeguards.
  # 2026-10-27 verification rerun after correcting two public judgment-record schema errors.
  push:
    paths:
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-etf-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke-test macro parsers (offline)
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_macro*.py' -v
      - name: Verify forward-audit logic (offline)
        run: python -m unittest discover -s tests -p 'test_signal_audit.py' -v
      - name: Verify macro ETF matching and industry evidence rules (offline)
        run: |
          python -m unittest discover -s tests -p 'test_market_links.py' -v
          python -m unittest discover -s tests -p 'test_industry_evidence.py' -v
      - name: Test collection health and public judgment provenance (offline)
        run: |
          python -m unittest discover -s tests -p 'test_system_health.py' -v
          python -m unittest discover -s tests -p 'test_decision_journal.py' -v
      - name: ETF daily scan
        id: etf_scan
        run: python scan.py
      - run: python build_journal.py
      - name: Freeze and audit prospective ETF candidate observations
        id: signal_audit
        continue-on-error: true
        run: python signal_audit.py
      - name: Collect official macroeconomic indicators
        id: macro_collect
        continue-on-error: true
        run: python macro_scan.py
      - name: Validate macro series completeness and freshness
        if: always()
        continue-on-error: true
        env:
          ETF_SCAN_OUTCOME: ${{ steps.etf_scan.outcome }}
          MACRO_COLLECTION_OUTCOME: ${{ steps.macro_collect.outcome }}
        run: python macro_health.py
      - name: Collect eight supplemental macro categories
        id: macro_extra
        continue-on-error: true
        timeout-minutes: 12
        run: python macro_extra.py
      - name: Link same-date macro observations and ETF market movement
        id: market_links
        continue-on-error: true
        run: python market_links.py
      - name: Verify issuer filings and industry evidence ledger
        id: industry_evidence
        continue-on-error: true
        run: python industry_evidence.py
      - name: Validate dated public ETF investment judgments
        id: decision_archive
        continue-on-error: true
        run: python decision_journal.py
      - name: Publish comprehensive data health report
        id: system_health
        if: always()
        continue-on-error: true
        env:
          ETF_SCAN_OUTCOME: ${{ steps.etf_scan.outcome }}
          MACRO_COLLECTION_OUTCOME: ${{ steps.macro_collect.outcome }}
          EXTRA_COLLECTION_OUTCOME: ${{ steps.macro_extra.outcome }}
          SCREEN_AUDIT_OUTCOME: ${{ steps.signal_audit.outcome }}
          MARKET_LINKS_OUTCOME: ${{ steps.market_links.outcome }}
          INDUSTRY_EVIDENCE_OUTCOME: ${{ steps.industry_evidence.outcome }}
          JUDGMENT_ARCHIVE_OUTCOME: ${{ steps.decision_archive.outcome }}
        run: python system_health.py
      - name: Save public market data and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ analysis/technical/ analysis/macro/ analysis/diagnostics/macro-health-latest.md analysis/diagnostics/history/
          if [ -d analysis/quality ]; then git add analysis/quality/; fi
          if [ -d analysis/links ]; then git add analysis/links/; fi
          if [ -d analysis/industry ]; then git add analysis/industry/; fi
          if [ -d analysis/decisions ]; then git add analysis/decisions/; fi
          if [ -d analysis/health ]; then git add analysis/health/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF market scan"
            # Interactive GitHub edits can land while the scan is running.
            # Rebase over them and retry instead of dropping collected data.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::Unable to publish public scan after 3 retries"
                exit 1
              fi
              sleep 3
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: |
            data/
            analysis/technical/
            analysis/quality/
            analysis/links/
            analysis/industry/
            analysis/decisions/
            analysis/health/
            analysis/macro/
            analysis/diagnostics/macro-health-latest.md
          if-no-files-found: warn

      - name: Fail run only after report is saved, if essential data are unsafe
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path("data/health/latest.json")
          if not p.is_file():
              print("::error::No end-to-end health report was published")
              sys.exit(1)
          try:
              report=json.loads(p.read_text(encoding="utf-8"))
          except (OSError,ValueError) as e:
              print(f"::error::Health report unreadable: {e}")
              sys.exit(1)
          if str(report.get("github_run_id")) != os.environ["GITHUB_RUN_ID"]:
              print("::error::Health report belongs to a DIFFERENT workflow run")
              sys.exit(1)
          print("DAILY_MARKET_HEALTH",report.get("status"),report.get("us_market_date"))
          if report.get("status") == "ERROR":
              print("::error::End-to-end data integrity failed; see analysis/health/latest.md")
              sys.exit(1)
          if report.get("status") not in ("WARN","OK"):
              print("::error::Unknown health state")
              sys.exit(1)
          if report.get("status")=="WARN":
              print("::warning::Partial data; report not fully current. See analysis/health/latest.md")
          PY
