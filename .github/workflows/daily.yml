name: Daily ETF market scan
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: daily-etf-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke-test macro parsers (offline)
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_macro_scan.py' -v
      - run: python scan.py
      - run: python build_journal.py
      - name: Collect official macroeconomic indicators
        continue-on-error: true
        run: python macro_scan.py
      - name: Save public market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ analysis/technical/ analysis/macro/
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF market scan"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-report
          path: |
            data/
            analysis/technical/
            analysis/macro/
          if-no-files-found: warn
