name: Macro data smoke test
# Re-test the fixed Treasury real-yield header and updated JOLTS lag handling.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macro-smoke.yml'
permissions:
  contents: write
concurrency:
  group: daily-etf-scan
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Offline parser tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_macro*.py' -v 2>&1 | tee /tmp/macro-offline-test.log
      - name: Live official macro requests
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python macro_scan.py 2>&1 | tee /tmp/macro-live-test.log
      - name: Check macro reliability
        id: health
        if: always()
        continue-on-error: true
        run: python macro_health.py
      - name: Save test result summary
        if: always()
        shell: bash
        env:
          UNIT_RESULT: ${{ steps.tests.outcome }}
          LIVE_RESULT: ${{ steps.live.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
        run: |
          mkdir -p analysis/diagnostics
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).isoformat()
          p=Path("data/macro/latest.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          recent = (d.get("generated_at_utc","")[:10]==now[:10] and
                    d.get("requested_series_count")==22)
          # Do not misattribute preexisting macro data to this smoke run.
          if not recent:
              d={}
          out=[
            "# Official macro source smoke-test diagnostic", "",
            f"- Checked at UTC: {now}",
            f"- Offline parser test outcome: {os.getenv('UNIT_RESULT')}",
            f"- Macro collection process outcome: {os.getenv('LIVE_RESULT')}",
            f"- Coverage health process outcome: {os.getenv('HEALTH_RESULT')}",
            f"- Requested series: {d.get('requested_series_count','not generated by this run')}",
            f"- Retrieved series: {d.get('retrieved_series_count','not generated by this run')}",
            f"- Current series: {d.get('current_series_count','not generated by this run')}",
            f"- Overall report status: {d.get('status','unavailable')}",
            f"- Market date: {d.get('market_date','unavailable')}",
            "", "## Per-series results",
          ]
          for r in d.get("series",[]):
              out.append(f"- {r['series_id']} : {r['status']} ({r['observation_date']})")
          out+=["","## Source errors"]
          for key,value in d.get("errors",{}).items():
              out.append(f"- {key} : {str(value)[:160]}")
          out+=["","## Offline unit test log","", "```text"]
          out+=Path("/tmp/macro-offline-test.log").read_text().splitlines()[-70:] if Path("/tmp/macro-offline-test.log").exists() else ["No offline-test log."]
          out+=["```","", "## Live collector log tail","", "```text"]
          out+=Path("/tmp/macro-live-test.log").read_text().splitlines()[-90:] if Path("/tmp/macro-live-test.log").exists() else ["No live-test log."]
          out+=["```",""]
          Path("analysis/diagnostics/macro-smoke-latest.md").write_text("\n".join(out),encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always save public diagnostics, even for partial data.
          git add -A analysis/diagnostics/
          # Only promote a fresh and fully validated result to the main archive.
          if [ "$UNIT_RESULT" = "success" ] && [ "$LIVE_RESULT" = "success" ] && [ "$HEALTH_RESULT" = "success" ]; then
            if python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          h=json.loads(Path("data/macro/health_latest.json").read_text())
          m=json.loads(Path("data/macro/latest.json").read_text())
          t=json.loads(Path("data/latest.json").read_text())
          generated=datetime.fromisoformat(m["generated_at_utc"].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-generated).total_seconds()
          assert 0 <= age <= 1200, "Data is not fresh from this smoke run"
          assert h["status"]=="OK" and m["status"]=="ok"
          assert h["current"]==m["retrieved_series_count"]==22
          assert m["market_date"]==t["us_market_date"]
          print("PROMOTION_VERIFIED",m["market_date"],h["current"],flush=True)
          PY
            then
              git add -A data/macro/ analysis/macro/
              echo "Verified macro results saved to data/macro/latest.json"
            else
              echo "::warning::Coverage incomplete or stale; main macro data not overwritten"
            fi
          else
            echo "::warning::Tests failed; main macro data not overwritten"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record macro smoke test and promote verified results"
            git push
          fi
